services:
  - type: web
    name: my-portfolio
    runtime: static
    buildCommand: npm install && node scripts/restore-rover-assets.mjs && npm run build
    staticPublishPath: dist
    routes:
      - type: redirect
        source: /rover
        destination: /rover/
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /rover
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /rover/*
        name: X-Robots-Tag
        value: noindex, nofollow
